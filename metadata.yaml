name: astrbot_plugin_yanyun_query
display_name: 燕云十六声查询
desc: |
  查询《燕云十六声》角色档案信息(角色名/等级/门派/修为/成就/家园/在线时长等)。

  数据来源:网易大神 datamsapi 生涯接口(协议已实测)。凭据获取支持两种方式:
  - WebUI 面板一键扫码:插件详情页「燕云凭据获取」→ 填角色编号 → 手机大神 App
    扫码登录 → 自动签发年度 token 并写入配置(需要 AstrBot >= 4.27.5,并安装
    playwright:`pip install playwright && playwright install chromium`)
  - 手动:按 README 在浏览器控制台跑 tools/get_token.js

  指令:
  - 燕云绑定 <角色编号> — 绑定自己的角色
  - 燕云解绑 — 解除绑定
  - 燕云我的 — 查询自己绑定的角色
  - 燕云查询 <角色编号> — 查询任意凭据池内角色
  - 燕云详情 / 燕云战绩 <角色编号> — 家园日常 / PVP 数据
  - 燕云状态 — 管理员:凭据池自检
  - 燕云帮助 — 用法说明

  ⚠ 本插件调用的是网易非公开接口,随时可能失效,仅供学习交流。
short_desc: 查询燕云十六声角色档案,支持面板一键扫码获取凭据
