name: astrbot_plugin_yanyun_query
display_name: 燕云十六声查询
desc: |
  查询《燕云十六声》角色档案:等级 / 门派 / 功力 / 成就 / 外观收集 / **探索度** / 区域收集(宝箱·蹊跷) / 流派配置(套装·功法·心法·装备·奇术) / 面板属性。

  数据来自网易大神 datamsapi 生涯接口(协议已实测)。

  **凭据获取(二选一)**

  - 群友自助:私聊机器人发「燕云登录」→ 扫码登录 → 回复序号选择角色 → 自动签发并绑定
  - 管理员:WebUI 插件详情页「燕云凭据获取」面板一键扫码;或按 README 手动获取

  **指令**

  - 燕云登录(私聊)— 扫码登录后选择角色并自动绑定
  - 燕云我的 — 角色档案 + 探索度 + 区域收集 + 流派配置
  - 燕云详情 — 家园日常 + 面板属性 + 属性一览图片卡(装备词条按装备分列 + 合并汇总,失败自动回退文本)
  - 燕云分析 — 流派养成对标报告(词条/战力对标+带部位的洗练方向)
  - 燕云战绩 — PVP 数据
  - 燕云状态 — 凭据池自检(仅管理员)
  - 燕云帮助 — 用法说明

  **依赖(全自动)**

  查询功能开箱即用。首次使用时插件会**自动检测并安装**无头浏览器
  (没有 playwright 就 pip 装,没有浏览器就下载 chromium;有系统 Chrome/Edge 直接复用)。
  WebUI 面板扫码需 AstrBot >= 4.27.5。配置大模型后还支持自然语言唤起。

  ⚠ 调用网易非公开接口,随时可能失效,仅供学习交流。
short_desc: 查询燕云十六声角色档案,支持流派养成对标分析与面板一键扫码获取凭据
